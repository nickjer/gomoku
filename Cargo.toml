[package]
name = "gomoku"
version = "0.1.0"
edition = "2024"
description = "An evolutionary genetic algorithm tool that optimizes strategies for playing Gomoku (five in a row)"
license = "MIT"
keywords = ["gomoku", "genetic-algorithm", "evolution", "game", "ai"]
categories = ["command-line-utilities", "game-development", "algorithms"]

[dependencies]
anyhow = "1"
postcard = { version = "1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
enum_dispatch = "0.3"
fastrand = "2"
fastrand-contrib = "0.1"
itertools = "0.14"
ratatui = "0.30"
rapidhash = "4"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
derive_more = { version = "2.1.1", features = ["add", "add_assign", "display", "not", "from", "try_into"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
